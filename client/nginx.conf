server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # config.js і сам застосунок не кешуємо жорстко: після зміни адреси шлюзу клієнт одразу бере нову.
    location = /config.js { add_header Cache-Control "no-store"; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
